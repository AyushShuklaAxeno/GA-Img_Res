name: Block img src

on:
  push:
  pull_request:

jobs:
  no-img-src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any HTML file uses <img src>
        shell: python
        run: |
          import re, sys, pathlib

          img_src = re.compile(r'<img\b[^>]*?\bsrc\s*=', re.I | re.S)
          comment = re.compile(r'<!--.*?-->', re.S)
          found = 0

          for path in pathlib.Path('.').rglob('*.html'):
              if 'node_modules' in path.parts or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              # blank out comments but keep line numbers intact
              text = comment.sub(lambda m: re.sub(r'[^\n]', ' ', m.group()), text)
              for m in img_src.finditer(text):
                  line = text.count('\n', 0, m.start()) + 1
                  print(f"::error file={path},line={line}::<img src> is not allowed in HTML files")
                  found += 1

          if found:
              print(f"\nFound {found} forbidden <img src> tag(s).")
              sys.exit(1)
          print("No <img src> tags found.")